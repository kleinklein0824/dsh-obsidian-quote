<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian 知识库</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.6 system-ui, sans-serif; --border: color-mix(in srgb, CanvasText 18%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; color: CanvasText; background: Canvas; overflow-wrap: anywhere; }
  h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 8px 0; } .muted { opacity: .7; font-size: 12px; }
  header, .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header { justify-content: space-between; }
  form { display: grid; gap: 16px; margin-top: 20px; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  label { display: grid; gap: 6px; min-width: 0; }
  input, select, button { font: inherit; color: inherit; background: Canvas; border: 1px solid var(--border); border-radius: 8px; min-height: 44px; }
  input, select { padding: 8px 10px; width: 100%; min-width: 0; }
  .scope { display: grid; gap: 8px; min-width: 0; }
  .scope-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .scope-title { font-weight: 600; }
  .scope-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .scope-item input { flex: 0 0 16px; width: 16px; height: 16px; min-height: 16px; margin: 0; padding: 0; }
  .scope-item span { min-width: 0; overflow-wrap: anywhere; }
  .scope-list { display: grid; gap: 2px; max-height: 140px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .scope-stale { opacity: .72; }
  .scope-empty { padding: 8px; }
  .add-path { display: grid; gap: 8px; min-width: 0; }
  .add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; min-width: 0; }
  button { padding: 8px 14px; cursor: pointer; } button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 2px solid Highlight; outline-offset: 3px; }
  button[type=submit] { background: CanvasText; color: Canvas; border-color: CanvasText; }
  #status { margin: 14px 0; } #results { display: grid; gap: 14px; }
  article { border-top: 1px solid var(--border); padding-top: 14px; }
  pre { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
  @media (max-width: 420px) { body { padding: 14px; } .fields { grid-template-columns: 1fr; } }
</style>
<main>
  <header><h1>Obsidian 知识库</h1><button id="refresh" type="button" disabled>刷新连接</button></header>
  <p id="summary" class="muted">正在连接已有知识库服务…</p>
  <form id="form">
    <div class="scope" role="group" aria-label="检索路径">
      <div class="scope-head"><span class="scope-title">检索范围</span><span id="scope-count" class="muted">全部已启用目录</span></div>
      <label class="scope-item"><input id="all-sources" type="checkbox" checked disabled><span>全部已启用目录</span></label>
      <div id="source-list" class="scope-list" role="group" aria-label="可选本地目录"></div>
    </div>
    <div class="add-path">
      <label class="scope-title" for="vault-path">添加本地路径</label>
      <div class="add-row"><input id="vault-path" type="text" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="例如 C:\Users\Klein\Notes"><button id="add-vault" type="button" disabled>添加</button></div>
    </div>
    <div class="fields"><label>返回内容<select id="mode"><option value="search">原文片段</option><option value="context">引用上下文</option></select></label></div>
    <label>关键词<input id="query" maxlength="500" autocomplete="off" placeholder="例如：组件命名规范"></label>
    <div class="row"><button id="search" type="submit" disabled>查询</button><label>返回条数<select id="limit"><option>3</option><option selected>5</option><option>10</option></select></label></div>
  </form>
  <p id="status" role="status" aria-live="polite">正在初始化面板…</p>
  <div id="results" aria-label="检索结果"></div>
  <p class="muted">输入本机文件夹完整路径即可添加。新路径会保存并建立索引，可与其他目录一起多选检索。</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let next = 0, ready = false, busy = false, invalidSource = false, indexing = false, refreshTimer = null;
  let enabledVaults = [], allVaults = [], selectedSources = null;
  const knownVaults = new Map();
  const pending = new Map();
  function notify(method, params) { parent.postMessage({ jsonrpc: '2.0', method, params }, '*'); }
  function rpc(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++next;
      const timeout = method === 'tools/call' ? 40000 : 20000;
      const timer = setTimeout(() => { pending.delete(id); reject(Error('面板请求超时，请刷新连接后重试。')); }, timeout);
      pending.set(id, { resolve, reject, timer });
      parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function theme(context) {
    if (context?.theme === 'dark' || context?.theme === 'light') document.documentElement.style.colorScheme = context.theme;
  }
  window.addEventListener('message', event => {
    if (event.source !== parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data, request = pending.get(message.id);
    if (request) {
      clearTimeout(request.timer); pending.delete(message.id);
      message.error ? request.reject(Error('客户端没有完成面板请求，请重试。')) : request.resolve(message.result);
    }
    if (message.method === 'ui/notifications/host-context-changed') theme(message.params);
  });
  async function call(name, args = {}) {
    const result = await rpc('tools/call', { name, arguments: args });
    if (result?.isError) throw Error(result.content?.find(item => item.type === 'text')?.text || '知识库请求失败。');
    if (!result?.structuredContent || typeof result.structuredContent !== 'object') throw Error('面板响应格式异常。');
    return result.structuredContent;
  }
  function lock(value) {
    busy = value; $('form').setAttribute('aria-busy', String(value));
    $('refresh').disabled = value || !ready;
    $('search').disabled = value || !ready || indexing || enabledVaults.length === 0;
    $('add-vault').disabled = value || !ready || indexing;
    $('vault-path').disabled = value || !ready || indexing;
    $('all-sources').disabled = value || !ready || enabledVaults.length === 0;
    $('source-list').querySelectorAll('input').forEach(input => { input.disabled = value || !ready; });
  }
  function renderScope() {
    const enabledIds = new Set(enabledVaults.map(vault => vault.id));
    const selected = selectedSources === null ? enabledVaults.map(vault => vault.id) : selectedSources;
    invalidSource = selectedSources !== null && selectedSources.some(id => !enabledIds.has(id));
    const allSelected = enabledVaults.length > 0 && !invalidSource && enabledVaults.every(vault => selected.includes(vault.id));
    $('all-sources').checked = selectedSources === null || allSelected;
    $('all-sources').indeterminate = selectedSources !== null && !allSelected && selected.length > 0;
    const validCount = selected.filter(id => enabledIds.has(id)).length;
    $('scope-count').textContent = selectedSources === null ? '全部 ' + enabledVaults.length + ' 个目录' : '已选 ' + validCount + ' 个目录';
    const list = $('source-list');
    list.replaceChildren();
    const nameCounts = new Map();
    allVaults.forEach(vault => nameCounts.set(vault.name, (nameCounts.get(vault.name) || 0) + 1));
    function addOption(vault, stale) {
      const label = document.createElement('label');
      label.className = stale ? 'scope-item scope-stale' : 'scope-item';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.value = vault.id; input.dataset.source = vault.id;
      if (stale) input.dataset.stale = 'true';
      input.checked = selected.includes(vault.id); input.disabled = busy || !ready;
      const name = nameCounts.get(vault.name) > 1 ? vault.name + ' (' + vault.id + ')' : vault.name;
      const noteCount = Number.isSafeInteger(vault.docs) ? ' · ' + vault.docs + ' 篇' : '';
      const suffix = stale ? (vault.enabled ? '（已失效）' : '（已停用）') : '';
      const text = document.createElement('span'); text.textContent = name + noteCount + suffix;
      label.append(input, text); list.append(label);
    }
    enabledVaults.forEach(vault => addOption(vault, false));
    const rendered = new Set(enabledVaults.map(vault => vault.id));
    selected.forEach(id => {
      if (rendered.has(id)) return;
      addOption(knownVaults.get(id) || { id, name: '之前选择的路径', enabled: true }, true);
    });
    if (list.childElementCount === 0) {
      const empty = document.createElement('span'); empty.className = 'muted scope-empty'; empty.textContent = '没有已启用的本地目录。'; list.append(empty);
    }
  }
  function scopeChanged() {
    renderScope();
    $('results').replaceChildren();
    $('status').textContent = invalidSource ? '之前选择的路径已失效，请移除失效项或重新选择。' :
      selectedSources !== null && selectedSources.length === 0 ? '请至少选择一个检索路径后再查询。' : '';
  }
  function applyState(data) {
    if (!Array.isArray(data.vaults)) throw Error('知识库列表格式异常。');
    allVaults = data.vaults;
    allVaults.forEach(vault => knownVaults.set(vault.id, vault));
    enabledVaults = allVaults.filter(vault => vault.enabled);
    indexing = data.indexing === true;
    renderScope();
    const docs = enabledVaults.every(v => Number.isSafeInteger(v.docs)) ? ' · ' + enabledVaults.reduce((sum, v) => sum + v.docs, 0) + ' 篇笔记' : '';
    $('summary').textContent = enabledVaults.length + ' 个已启用目录' + docs + (indexing ? ' · 正在建立索引' : ' · 刚刚刷新');
  }
  function scheduleIndexRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = indexing && ready ? setTimeout(() => { refreshTimer = null; void refresh(); }, 1500) : null;
  }
  async function refresh() {
    lock(true); $('status').textContent = '正在检查知识库连接…';
    try {
      const data = await call('oq_panel_state');
      applyState(data);
      $('status').textContent = indexing ? '正在建立索引，完成后即可查询。' : invalidSource ? '之前选择的路径已失效，请移除失效项或重新选择。' : enabledVaults.length ? '连接成功。选择一个或多个目录后查询，结果会直接显示在下方。' : '没有已启用目录，请添加本地文件夹路径。';
    } catch (error) { $('summary').textContent = '连接尚未验证'; $('status').textContent = error.message; }
    finally { lock(false); scheduleIndexRefresh(); }
  }
  $('all-sources').addEventListener('change', event => {
    selectedSources = event.currentTarget.checked ? null : [];
    scopeChanged();
  });
  $('source-list').addEventListener('change', event => {
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || !input.dataset.source) return;
    const selected = new Set(selectedSources === null ? enabledVaults.map(vault => vault.id) : selectedSources);
    if (input.checked) selected.add(input.dataset.source);
    else selected.delete(input.dataset.source);
    selectedSources = [...selected];
    scopeChanged();
  });
  $('refresh').addEventListener('click', refresh);
  $('add-vault').addEventListener('click', async () => {
    if (busy || !ready || indexing) return;
    const vaultPath = $('vault-path').value.trim();
    if (!vaultPath) { $('status').textContent = '请输入本机文件夹的完整路径。'; $('vault-path').focus(); return; }
    lock(true); $('status').textContent = '正在验证并添加路径…'; $('results').replaceChildren();
    try {
      const added = await call('oq_panel_add_vault', { path: vaultPath });
      const id = added.vault.id;
      if (selectedSources !== null && !selectedSources.includes(id)) selectedSources = [...selectedSources, id];
      $('vault-path').value = '';
      const data = await call('oq_panel_state');
      if (!data.vaults.some(vault => vault.id === id)) throw Error('路径已登记，但目录列表尚未更新，请刷新连接。');
      applyState(data);
      $('status').textContent = indexing ? '路径已添加，正在建立索引…' : '路径已添加，并已加入检索范围。';
    } catch (error) { $('status').textContent = error.message; }
    finally { lock(false); scheduleIndexRefresh(); }
  });
  $('vault-path').addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); $('add-vault').click(); }
  });
  $('form').addEventListener('submit', async event => {
    event.preventDefault(); if (busy || !ready) return;
    if (invalidSource) { $('status').textContent = '之前选择的来源已失效，请重新选择检索范围。'; return; }
    const enabledIds = new Set(enabledVaults.map(vault => vault.id));
    const sources = selectedSources === null ? enabledVaults.map(vault => vault.id) : selectedSources;
    if (sources.some(id => !enabledIds.has(id))) { $('status').textContent = '之前选择的路径已失效，请移除失效项或重新选择。'; return; }
    if (sources.length === 0) { $('status').textContent = '请至少选择一个检索路径后再查询。'; return; }
    const query = $('query').value.trim();
    if (!query) { $('status').textContent = '请先填写关键词。'; $('query').focus(); return; }
    lock(true); $('status').textContent = '正在检索…'; $('results').replaceChildren();
    try {
      const data = await call('oq_panel_query', { query, sources, mode: $('mode').value, limit: Number($('limit').value) });
      const results = $('results');
      for (const hit of data.hits || []) {
        const article = document.createElement('article');
        const heading = document.createElement('h2'); heading.textContent = hit.title + (hit.heading ? ' › ' + hit.heading : '');
        const source = document.createElement('p'); source.className = 'muted'; source.textContent = hit.vault + ' / ' + hit.path;
        const excerpt = document.createElement('pre'); excerpt.textContent = hit.excerpt;
        article.append(heading, source, excerpt); results.append(article);
      }
      if (data.mode === 'context' && data.markdown) { const pre = document.createElement('pre'); pre.textContent = data.markdown; results.append(pre); }
      $('status').textContent = (data.warnings || []).join('\n') || (results.childElementCount ? '检索完成。' : '没有匹配的笔记。');
    } catch (error) { $('status').textContent = error.message; }
    finally { lock(false); }
  });
  async function start() {
    try {
      const init = await rpc('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'Obsidian Quote', version: '0.1.6' }, appCapabilities: {} });
      theme(init?.hostContext); notify('ui/notifications/initialized', {}); ready = true;
      new ResizeObserver(() => notify('ui/notifications/size-changed', { height: document.documentElement.scrollHeight })).observe(document.body);
      await refresh();
    } catch (error) { $('status').textContent = '当前窗口未建立原生面板连接。请从插件设置中的“打开知识库面板”重新打开。'; }
  }
  window.addEventListener('pagehide', () => { if (refreshTimer) clearTimeout(refreshTimer); });
  start();
})();
</script>
</html>
