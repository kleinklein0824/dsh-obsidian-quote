# dsh bundle patch: inserts this bundle into a profile's layer stack.
# 2-space indentation throughout, same shape as the other bundles in this
# workspace (a 4-space list marker with a 6-space continuation mixes two
# dominant steps and trips the loader's YAML lint).
- insert:
  - id: dsh-obsidian-quote-panel
    name: 'dsh-obsidian-quote-panel'
